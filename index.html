 S.rt=S.rt.filter(x=>x.date!='weekoff');S.rt.unshift(...r.data);R();done('Week off saved')}

function tbTable(){
 const c=S.c.map(x=>[x.name,cbal(x.name)]),e=ST().map(n=>[n,ebal(n)]);
 const D=a=>sum(a.filter(x=>x[1]>0).map(x=>x[1])),C=a=>sum(a.filter(x=>x[1]<0).map(x=>-x[1]));
 const g=(t,a)=>{const r=a.filter(x=>x[1]!=0);return `<tr class="tbh"><td colspan="3">${t}</td></tr>`+(r.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${x[1]>0?fm(x[1]):''}</td><td class="n">${x[1]<0?fm(-x[1]):''}</td></tr>`).join('')||'<tr><td colspan="3" class="m">No balances</td></tr>')+`<tr class="tbs"><td>Total ${t}</td><td class="n">${fm(D(r))}</td><td class="n">${fm(C(r))}</td></tr>`};
 const all=[...c,...e];
 return `<div class="tw"><table><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>${g('Customers',c)}${g('Executives',e)}<tr class="tbg"><td>Grand total</td><td class="n">${fm(D(all))}</td><td class="n">${fm(C(all))}</td></tr></table></div>`}
function Vtb(){

 return `<div class="kp">${kp('Total debit',fm(sum(all.filter(x=>x>0))))}${kp('Total credit',fm(sum(all.filter(x=>x<0).map(x=>-x))))}${kp('Customers',S.c.length)}${kp('Executives',S.st.length)}</div><div class="card"><h3>Trial balance · as on ${today()}</h3>${tbTable()}<div class="m" style="margin-top:8px">Debit = amount still to receive. Credit = advance or overpaid.</div><button class="btn" onclick="tbPrint()">🖨 Print</button></div>`}

 $('#inv').innerHTML=`<div class="np ivbar"><b>${l.length} invoice${l.length>1?'s':''} · one per page</b><button class="btn" onclick="print()">Print all</button><button class="btn o" onclick="$('#inv').hidden=true">Close</button></div>`+l.map(o=>invSheet(o)).join('');

function invSheet(o,btn){
 const c=S.c.find(x=>x.name==o.shop),rt=sum(o.items.map(i=>i.r*i.pr)),hb=o.items.some(i=>bxOf(i)>0),cs=hb?4:3;
 const g=gross(o),d=Math.min(+o.disc||0,g),t=tot(o)-(g-d);
 return `<div class="sheet"><div class="ivtop"><div><h2>${esc(CO.name)}</h2>${CO.tag?`<div class="ivsub">${esc(CO.tag)}</div>`:''}${coLines()}</div><div class="ivmeta"><b>TAX INVOICE</b><div>${o.no}</div><div>${o.date}</div>${o.due?`<div>Due: ${o.due}</div>`:''}</div></div>`
 +`<div class="ivgrid"><div><div class="k">Bill to</div><b>${esc(o.shop)}</b>${c&&c.phone?`<div>${esc(c.phone)}</div>`:''}${c&&c.addr?`<div>${esc(c.addr)}</div>`:''}</div><div><div class="k">Delivery through</div><b>${esc(o.by)}</b><div>Status: ${o.st}</div></div></div>`
 +`<table><tr><th>Item</th>${hb?'<th class="n">Box</th>':''}<th class="n">Pcs</th><th class="n">Rate</th><th class="n">Amount</th></tr>${o.items.map(i=>`<tr><td>${esc(i.p)}</td>${hb?`<td class="n">${bxOf(i)||''}</td>`:''}<td class="n">${i.q}</td><td class="n">${fm(i.pr)}</td><td class="n">${fm(i.q*i.pr)}</td></tr>`).join('')}`
 +(rt?`<tr class="ivl"><td colspan="${cs}">Less: returns</td><td class="n">−${fm(rt)}</td></tr>`:'')
 +`<tr class="ivl"><td colspan="${cs}">Subtotal</td><td class="n">${fm(g)}</td></tr>`
 +(d?`<tr class="ivl"><td colspan="${cs}">Less: discount</td><td class="n">−${fm(d)}</td></tr>`:'')
 +(t?`<tr class="ivl"><td colspan="${cs}">Add: GST / tax @ ${o.taxp}%</td><td class="n">${fm(t)}</td></tr>`:'')
 +`<tr class="ivgt"><td colspan="${cs}">Total payable</td><td class="n">${fm(tot(o))}</td></tr></table>`
 +`<div class="ivw">Amount in words: ${words(tot(o))} rupees only</div>`
 +(o.notes?`<div class="ivn"><b>Notes &amp; terms</b><br>${esc(o.notes)}</div>`:'')
 +`<div class="ivfoot">Goods once sold are taken back only as per company policy · Thank you for your business</div><div class="ivsign"><div>Customer signature</div><div>For ${esc(CO.name)}</div></div>`
 +(btn?`<button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button>`:'')+`</div>`}
function words(n){
 n=Math.round(+n||0);if(!n)return 'Zero';
 const ONE=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const TEN=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const t2=v=>v<20?ONE[v]:TEN[Math.floor(v/10)]+(v%10?' '+ONE[v%10]:'');
 const t3=v=>[(v>=100?ONE[Math.floor(v/100)]+' Hundred':''),(v%100?t2(v%100):'')].filter(s=>s).join(' ');
 let out=[],r=n;
 if(r>=10000000){out.push(t2(Math.floor(r/10000000))+' Crore');r%=10000000}
 if(r>=100000){out.push(t2(Math.floor(r/100000))+' Lakh');r%=100000}
 if(r>=1000){out.push(t2(Math.floor(r/1000))+' Thousand');r%=1000}
 if(r>0)out.push(t3(r));
 return out.join(' ')}
