<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ayurgra – Office</title>
<style>
:root{--bg:#f2f6ef;--c:#fff;--t:#17261b;--m:#6b7d6e;--g:#2f7d3a;--g2:#1f5c29;--s:#e6f1e2;--b:#e0e9dc;--r:#c0392b;--y:#b7791f;--sh:0 2px 10px #1d3a2314;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1811;--c:#18241b;--t:#e7f0e7;--m:#9aab9c;--g:#58b866;--g2:#2f7d3a;--s:#223427;--b:#2a3a2d;--r:#ff8a80;--y:#f0b44c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1811;--c:#18241b;--t:#e7f0e7;--m:#9aab9c;--g:#58b866;--g2:#2f7d3a;--s:#223427;--b:#2a3a2d;--r:#ff8a80;--y:#f0b44c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
aside{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{display:none}#nav{display:flex}#nav button{flex:1;border:0;background:none;color:var(--m);padding:9px 0 8px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}#nav button i{font-style:normal;font-size:20px}#nav button.on{color:var(--g);font-weight:600}
.ct{padding-bottom:80px}.hd{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:22px 18px 46px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hd h1{margin:0;font-size:22px}.hd p{margin:2px 0 0;opacity:.85;font-size:13px}
main{max-width:860px;margin:-30px auto 0;padding:0 14px 30px}
@media(min-width:820px){aside{top:0;right:auto;width:220px;border:0;border-right:1px solid var(--b);padding:20px 12px}.brand{display:block;font-size:19px;font-weight:700;margin:0 8px 22px;color:var(--g)}.brand small{display:block;font-size:12px;color:var(--m);font-weight:400}#nav{flex-direction:column;gap:4px}#nav button{flex:none;flex-direction:row;font-size:15px;gap:10px;padding:11px 12px;border-radius:10px}#nav button.on{background:var(--s)}.ct{margin-left:220px;padding-bottom:0}}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}.card h3{margin:0 0 12px;font-size:16px}h4{margin:18px 2px 8px;font-size:14px;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:620px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp .card{margin:0;padding:13px}.k{font-size:12px;color:var(--m)}.v{font-size:21px;font-weight:700;margin-top:2px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);margin-bottom:8px}input:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row input{width:84px;margin:0 0 6px}.fl{display:grid;gap:0 10px}@media(min-width:620px){.fl{grid-template-columns:1fr 1fr}}
.btn{background:var(--g);color:#fff;border:0;padding:9px 15px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}.btn.o{background:var(--s);color:var(--g)}.btn.d{background:transparent;color:var(--r);border:1px solid var(--b)}.hd .btn{background:#fff;color:var(--g2);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);padding:6px 13px;border-radius:20px;font:inherit;font-size:13px}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.it{display:flex;gap:12px;align-items:flex-start}.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--s);color:var(--g);display:grid;place-items:center;font-weight:700}.f1{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.m{color:var(--m);font-size:13px}.amt{font-weight:700;white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--s);white-space:nowrap}.Pending{color:var(--y)}.Approved,.Delivered,.Confirmed{color:var(--g)}.Rejected,.Cancelled{color:var(--r)}.bad{color:var(--r)}.ok{color:var(--g)}
.act select{width:auto;margin:6px 6px 0 0;padding:8px}.empty{text-align:center;color:var(--m);padding:26px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:12px}td.n,th.n{text-align:right}
#md{position:fixed;inset:0;z-index:8;background:#000b;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 14px}#md[hidden]{display:none}.mb{background:var(--c);color:var(--t);border-radius:18px;width:100%;max-width:520px;padding:18px;margin:auto;box-shadow:0 12px 40px #0008}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h3{margin:0;font-size:18px}.mh .btn{margin:0}
#inv{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:9}#inv .sheet{max-width:680px;margin:0 auto;background:#fff;color:#111;padding:24px;border-radius:12px}#inv table{margin:12px 0}#inv th,#inv td{border-color:#ddd}
@media print{#shell,#md{display:none!important}#inv{position:static;padding:0;background:#fff}.np{display:none}}
</style></head><body>
<div id="shell"><aside><div class="brand">🌿 Ayurgra<small>Office panel</small></div><div id="nav"></div></aside><div class="ct"><div class="hd" id="hd"></div><main id="app"></main></div></div><div id="md" hidden></div><div id="inv" hidden></div>
<script>
const $=s=>document.querySelector(s);
const P=[['Neem & Tulsi Soap',45],['Sandal Soap',55],['Aloe Vera Soap',50],['Turmeric Soap',60]];
const EX=['Ravi','Anil','Suresh'];
const load=()=>{let s;try{s=JSON.parse(localStorage.getItem('ay'))}catch(e){}s=s||{o:[],s:[],n:1};s.c=s.c||[];s.cp=s.cp||[];return s};
let S=load();const save=()=>{try{localStorage.setItem('ay',JSON.stringify(S))}catch(e){}};
const fm=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const tot=o=>sum(o.items.map(i=>(i.q-i.r)*i.pr));
const live=()=>S.o.filter(o=>o.st!='Cancelled');
const ebal=e=>sum(live().filter(o=>o.by==e).map(tot))-sum(S.s.filter(s=>s.ex==e&&s.st=='Approved').map(s=>s.amt));
const epend=e=>sum(S.s.filter(s=>s.ex==e&&s.st=='Pending').map(s=>s.amt));
const cbal=n=>sum(live().filter(o=>o.shop==n).map(tot))-sum(S.cp.filter(p=>p.cust==n).map(p=>p.amt));
const today=()=>new Date().toLocaleDateString('en-IN');
const pd=s=>{const[d,m,y]=String(s).split('/');return new Date(y,m-1,d).getTime()||0};
let tab='orders',f='All',q='',lt='Customer',le='';
const T=[['orders','📦','Orders'],['collect','💰','Collection'],['cust','👥','Customers'],['ledger','📒','Ledger']];
const H={orders:['Orders','Create and manage orders'],collect:['Collection','Approve payments and receive money'],cust:['Customers','Your shops and outstanding'],ledger:['Ledger','Statement with running balance']};
addEventListener('storage',()=>{S=load();R()});
let MF=null;
function openM(t,fn,note){MF=[t,fn];$('#md').innerHTML=`<div class="mb"><div class="mh"><h3>${t}</h3><button class="btn d" onclick="closeM()">✕ Close</button></div>${note?`<div class="ok" style="margin-bottom:10px;font-weight:600">✓ ${note}</div>`:''}${fn()}</div>`;$('#md').hidden=false}
const again=n=>MF&&openM(MF[0],MF[1],n);
function closeM(){$('#md').hidden=true;$('#md').innerHTML='';MF=null}
const newOrder=()=>openM('New order',form);
const newColl=()=>openM('Add collection',collForm);
const newCust=()=>openM('New customer',custForm);
function collForm(){return `<div class="k">Customer</div><select id="pc">${S.c.length?S.c.map(c=>`<option value="${esc(c.name)}">${esc(c.name)} (due ${fm(cbal(c.name))})</option>`).join(''):'<option value="">Add a customer first</option>'}</select><div class="k">Amount</div><input type="number" min="1" id="pa" placeholder="Amount"><div class="k">Mode</div><select id="pm"><option>Cash</option><option>UPI</option><option>Bank</option></select><button class="btn" onclick="cpay()">Save collection</button>`}
function custForm(){return `<input id="cn" placeholder="Shop / customer name"><input id="cph" placeholder="Phone"><input id="ca" placeholder="Address"><button class="btn" onclick="addC()">Save customer</button>`}
function go(t){tab=t;R();scrollTo(0,0)}
function R(){
 $('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');
 $('#hd').innerHTML=`<div><h1>${H[tab][0]}</h1><p>${H[tab][1]}</p></div>`+({orders:['+ New order','newOrder'],collect:['+ Add collection','newColl'],cust:['+ New customer','newCust']}[tab]?`<button class="btn" onclick="${({orders:'newOrder',collect:'newColl',cust:'newCust'})[tab]}()">${({orders:'+ New order',collect:'+ Add collection',cust:'+ New customer'})[tab]}</button>`:'');
 $('#app').innerHTML=({orders:Vo,collect:Vc,cust:Vu,ledger:Vl})[tab]();
}
const kp=(k,v,c)=>`<div class="card"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;
/* ORDERS */
function Vo(){
 return `<div class="kp">${kp('Orders',S.o.length)}${kp('Sales',fm(sum(live().map(tot))))}${kp('Pending orders',S.o.filter(o=>o.st=='Pending').length,'')}${kp('Awaiting approval',fm(sum(EX.map(epend))),'bad')}</div>`
 +`<div class="chips">${['All','Pending','Confirmed','Delivered','Cancelled'].map(s=>`<button class="${s==f?'on':''}" onclick="f='${s}';R()">${s}</button>`).join('')}</div><input placeholder="🔍 Search shop, order no, executive" value="${esc(q)}" oninput="q=this.value;$('#ol').innerHTML=ol()"><div id="ol">${ol()}</div>`}
function ol(){const k=q.toLowerCase();return S.o.filter(o=>(f=='All'||o.st==f)&&(o.shop+o.no+o.by).toLowerCase().includes(k)).map(oc).join('')||'<div class="empty">No orders found</div>'}
function oc(o){
 const rt=sum(o.items.map(i=>i.r*i.pr));
 return `<div class="card"><div class="it"><div class="av">${esc(o.shop[0]||'?').toUpperCase()}</div><div class="f1"><div class="top"><b>${esc(o.shop)}</b><span class="amt">${fm(tot(o))}</span></div><div class="m">${o.no} · ${o.date} · ${esc(o.by)}</div><div class="m">${o.items.map(i=>i.q+'× '+i.p).join(', ')}${rt?` · returns ${fm(rt)}`:''}</div>
 <div class="act"><span class="tag ${o.st}">${o.st}</span><br><select onchange="stt(${o.id},this.value)">${['Pending','Confirmed','Delivered','Cancelled'].map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`)}</select><button class="btn o" onclick="inv(${o.id})">Invoice</button><button class="btn d" onclick="del(${o.id})">Delete</button></div></div></div></div>`}
function form(){return `<div class="fl"><div><div class="k">Customer / shop</div><input id="shop" list="cl" placeholder="Type or pick customer"><datalist id="cl">${S.c.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div><div class="k">Order for</div><select id="by"><option>Office</option>${EX.map(e=>`<option>${e}</option>`)}</select></div></div>${P.map((p,i)=>`<div class="row"><span>${p[0]} <span class="m">${fm(p[1])}</span></span><input type="number" min="0" id="q${i}" value="0"></div>`).join('')}<button class="btn" onclick="mk()">Create order</button>`}
function mk(){
 const shop=$('#shop').value.trim(),items=P.map((p,i)=>({p:p[0],pr:p[1],q:+$('#q'+i).value||0,r:0})).filter(i=>i.q>0);
 if(!shop||!items.length)return alert('Enter customer and at least one quantity');
 S=load();S.o.unshift({id:S.n,no:'AY-'+String(S.n).padStart(4,'0'),date:today(),by:$('#by').value,shop,items,st:'Pending'});S.n++;save();R();again('Order created. Add another or close.');
}
function stt(id,v){S=load();S.o.find(x=>x.id==id).st=v;save();R()}
function del(id){if(confirm('Delete this order?')){S=load();S.o=S.o.filter(x=>x.id!=id);save();R()}}
/* COLLECTION */
function Vc(){
 const p=S.s.filter(s=>s.st=='Pending'),h=S.s.filter(s=>s.st!='Pending');
 const hist=[...h.map(s=>({id:s.id,t:s.ex+' · settlement',a:s.amt,m:s.mode,d:s.date,st:s.st})),...S.cp.map(x=>({id:x.id,t:x.cust+' · customer payment',a:x.amt,m:x.mode,d:x.date,st:'Received'}))].sort((a,b)=>b.id-a.id);
 return `<div class="kp">${kp('Awaiting approval',fm(sum(p.map(s=>s.amt))),'bad')}${kp('Executive dues',fm(sum(EX.map(ebal))))}${kp('Customer payments',fm(sum(S.cp.map(x=>x.amt))),'ok')}${kp('Customer dues',fm(sum(S.c.map(c=>cbal(c.name)))))}</div>
 <h4>Executive settlements to approve</h4>${p.map(s=>`<div class="card"><div class="top"><b>${fm(s.amt)} · ${s.mode}</b><span class="tag Pending">Pending</span></div><div class="m">${esc(s.ex)} · ${s.date}</div><button class="btn" onclick="ap(${s.id},'Approved')">Approve</button><button class="btn d" onclick="ap(${s.id},'Rejected')">Reject</button></div>`).join('')||'<div class="empty">Nothing waiting for approval</div>'}
 <h4>History</h4>${hist.map(x=>`<div class="card"><div class="top"><b>${fm(x.a)} · ${x.m}</b><span class="tag ${x.st}">${x.st}</span></div><div class="m">${esc(x.t)} · ${x.d}</div></div>`).join('')||'<div class="empty">No history</div>'}`}
function ap(id,v){S=load();S.s.find(x=>x.id==id).st=v;save();R()}
function cpay(){const c=$('#pc').value,a=+$('#pa').value;if(!c||!(a>0))return alert('Choose customer and enter amount');S=load();S.cp.unshift({id:Date.now(),cust:c,amt:a,mode:$('#pm').value,date:today()});save();R();again('Collection saved. Add another or close.')}
/* CUSTOMERS */
function Vu(){
 return ''
 +(S.c.map(c=>{const b=cbal(c.name);return `<div class="card"><div class="it"><div class="av">${esc(c.name[0]||'?').toUpperCase()}</div><div class="f1"><div class="top"><b>${esc(c.name)}</b><span class="amt ${b>0?'bad':'ok'}">${fm(b)}</span></div><div class="m">${esc(c.phone||'No phone')} · ${esc(c.addr||'No address')}</div><div class="m">${S.o.filter(o=>o.shop==c.name).length} orders</div><button class="btn o" onclick="lt='Customer';le=this.dataset.n;go('ledger')" data-n="${esc(c.name)}">Open ledger</button></div></div></div>`}).join('')||'<div class="empty">No customers yet</div>')}
function addC(){const n=$('#cn').value.trim();if(!n)return alert('Enter name');S=load();if(S.c.some(c=>c.name.toLowerCase()==n.toLowerCase()))return alert('Customer already exists');S.c.push({id:Date.now(),name:n,phone:$('#cph').value.trim(),addr:$('#ca').value.trim()});save();R();again('Customer added. Add another or close.')}
/* LEDGER */
function rows(){
 let r=[];
 if(lt=='Customer'){live().filter(o=>o.shop==le).forEach(o=>r.push({d:o.date,t:'Invoice '+o.no,dr:tot(o),cr:0,k:0,id:o.id}));S.cp.filter(p=>p.cust==le).forEach(p=>r.push({d:p.date,t:'Payment ('+p.mode+')',dr:0,cr:p.amt,k:1,id:p.id}))}
 else{live().filter(o=>o.by==le).forEach(o=>r.push({d:o.date,t:'Invoice '+o.no+' · '+o.shop,dr:tot(o),cr:0,k:0,id:o.id}));S.s.filter(s=>s.ex==le&&s.st=='Approved').forEach(s=>r.push({d:s.date,t:'Settlement ('+s.mode+')',dr:0,cr:s.amt,k:1,id:s.id}))}
 r.sort((a,b)=>pd(a.d)-pd(b.d)||a.k-b.k||a.id-b.id);let b=0;r.forEach(x=>{b+=x.dr-x.cr;x.b=b});return r}
function ltable(r){return `<div class="tw"><table><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>${r.map(x=>`<tr><td>${x.d}</td><td>${esc(x.t)}</td><td class="n">${x.dr?fm(x.dr):''}</td><td class="n">${x.cr?fm(x.cr):''}</td><td class="n">${fm(x.b)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No entries</td></tr>'}${r.length?`<tr><td colspan="2"><b>Closing balance</b></td><td class="n"><b>${fm(sum(r.map(x=>x.dr)))}</b></td><td class="n"><b>${fm(sum(r.map(x=>x.cr)))}</b></td><td class="n"><b>${fm(r[r.length-1].b)}</b></td></tr>`:''}</table></div>`}
function Vl(){
 const list=lt=='Customer'?S.c.map(c=>c.name):EX;if(!list.includes(le))le=list[0]||'';
 const r=rows();
 return `<div class="chips">${['Customer','Executive'].map(s=>`<button class="${s==lt?'on':''}" onclick="lt='${s}';le='';R()">${s} ledger</button>`).join('')}</div>
 <div class="card"><select onchange="le=this.value;R()">${list.map(n=>`<option value="${esc(n)}" ${n==le?'selected':''}>${esc(n)}</option>`).join('')||'<option>No customers yet</option>'}</select>${ltable(r)}${r.length?`<button class="btn o" onclick="lp()">Print ledger</button>`:''}<div class="m" style="margin-top:8px">Debit = invoices (after returns). Credit = payments received${lt=='Executive'?' (approved settlements only)':''}.</div></div>`}
function lp(){$('#inv').innerHTML=`<div class="sheet"><h2 style="margin:0">Ayurgra Herbal Soap</h2><div style="color:#555">${lt} ledger · ${esc(le)} · ${today()}</div>${ltable(rows())}<button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button></div>`;$('#inv').hidden=false}
/* INVOICE */
function inv(id){
 const o=S.o.find(x=>x.id==id),c=S.c.find(x=>x.name==o.shop),rt=sum(o.items.map(i=>i.r*i.pr));
 $('#inv').innerHTML=`<div class="sheet"><h2 style="margin:0;color:#1f5c29">Ayurgra Herbal Soap</h2><div style="color:#555">Invoice ${o.no} · ${o.date}</div><p>Bill to: <b>${esc(o.shop)}</b>${c?`<br>${esc(c.phone||'')} ${esc(c.addr||'')}`:''}<br>Delivery: ${esc(o.by)}</p><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>${o.items.map(i=>`<tr><td>${i.p}</td><td class="n">${i.q}</td><td class="n">${fm(i.pr)}</td><td class="n">${fm(i.q*i.pr)}</td></tr>`).join('')}${rt?`<tr><td colspan="3">Returns</td><td class="n">−${fm(rt)}</td></tr>`:''}<tr><td colspan="3"><b>Total</b></td><td class="n"><b>${fm(tot(o))}</b></td></tr></table><button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button></div>`;
 $('#inv').hidden=false}
R();
</script></body></html>
