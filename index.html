 const ph=$('#ph').value.replace(/\D/g,''),pw=$('#pw').value;

async function signin(ph,pw){
 const {data,error}=await db.from('accounts').select('*').eq('phone',ph).maybeSingle();
 if(error)throw new Error('Could not reach the database: '+error.message);
 if(!data)throw new Error('No account uses that number. Ask the admin to add you.');
 if(await sha(data.salt+':'+ph+':'+pw)!==data.pw_hash)throw new Error('Wrong password.');

 $('#app').innerHTML=accBar()+'<div class="empty">Loading from Supabase…</div>';
 try{

 return `${(odf||odt)?`<div class="m hint">${list.length} invoice(s)${rlab(odf,odt)} · ${fm(sum(list.filter(o=>o.st!='Cancelled').map(tot)))} in range. The cards on top stay all-time.</div>`:''}${list.map(oc).join('')||'<div class="empty">No orders found</div>'}`}
function oc(o){
 const rt=sum(o.items.map(i=>i.r*i.pr));
 return `<div class="card ost-${o.st}"><div class="it"><input type="checkbox" class="ck" ${sel.has(o.id)?'checked':''} onchange="tg(${o.id},this.checked)" title="Select for multiple print"><div class="av">${esc(o.shop[0]||'?').toUpperCase()}</div><div class="f1"><div class="top"><b>${esc(o.shop)}</b><span class="amt">${fm(tot(o))}</span></div><div class="m">${o.no} · ${o.date} · ${esc(o.by)}</div><div class="m">${o.items.map(i=>i.q+'× '+i.p).join(', ')}${rt?` · returns ${fm(rt)}`:''}${o.disc?` · discount ${fm(o.disc)}`:''}${o.taxp?` · GST ${o.taxp}%`:''}${o.due?` · due ${o.due}`:''}</div>
 <div class="act"><span class="tag ${o.st}">${o.st}</span> ${btag(S.c.find(x=>x.name==o.shop))}<br><select onchange="stt(${o.id},this.value)">${['Pending','Confirmed','Delivered','Cancelled'].map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`)}</select><button class="btn o" onclick="editO(${o.id})">Edit</button><button class="btn o" onclick="inv(${o.id})">Invoice</button><button class="btn d" onclick="del(${o.id})">Delete</button></div></div></div></div>`}
function form(e){
 const nxt=e?e.no:'AY-'+String(S.o.reduce((m,o)=>Math.max(m,o.id),0)+1).padStart(4,'0');
 return `<div class="ivh"><div><div class="k">Invoice no.</div><div class="ivno">${nxt}</div></div><div class="ivhcol"><div class="k">Invoice date</div><input id="idate" value="${esc(e?e.date:today())}"></div><div class="ivhcol"><div class="k">Status</div><select id="ist">${['Pending','Confirmed','Delivered',...(e?['Cancelled']:[])].map(x=>`<option ${e&&x==e.st?'selected':''}>${x}</option>`).join('')}</select></div></div>`
 +`<div class="fl"><div><div class="k">Bill to (customer / shop)</div><input id="shop" list="cl" value="${esc(e?e.shop:'')}" placeholder="Type or pick customer" oninput="oiCust()"><datalist id="cl">${S.c.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="m" id="custinfo"></div></div><div><div class="k">Order for</div><select id="by">${['Office',...S.st.map(x=>x.name),...(e&&e.by!='Office'&&!S.st.some(x=>x.name==e.by)?[e.by]:[])].map(n=>`<option ${e&&n==e.by?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>`
 +`<div class="tw"><table class="oit"><thead><tr><th class="c">#</th><th>Item</th><th class="n">Box</th><th class="n">Pcs</th><th class="n">Rate</th><th class="n">Amount</th><th class="c"></th></tr></thead><tbody id="oib">${e?e.items.map(i=>oiRow(i)).join(''):oiRow()}</tbody></table></div>`
 +`<datalist id="oip">${S.prod.map(p=>`<option value="${esc(p.name)}">${fm(p.rate)}${p.pcs?' · '+p.pcs+' pcs/box':''} · stock ${nf(made(p.name)-sold(p.name))}</option>`).join('')}</datalist>`
 +`<button class="btn o" type="button" onclick="oiAdd()">+ Add item</button>`
 +`<div class="oitot"><div class="fl2"><div><div class="k">Discount (₹)</div><input type="number" min="0" id="idisc" value="${e?e.disc:0}" oninput="oiRec()"></div><div><div class="k">GST / tax (%)</div><input type="number" min="0" max="100" id="itaxp" value="${e?e.taxp:0}" oninput="oiRec()"></div></div><div class="tsum"><div class="r1"><span>Subtotal</span><b id="tsub">₹0</b></div><div class="r1"><span>Discount</span><b id="tdisc">−₹0</b></div><div class="r1"><span>GST / tax</span><b id="ttax">₹0</b></div><div class="r1 gt"><span>Grand total</span><b id="tgrand">₹0</b></div></div></div>`
 +`<div class="fl"><div><div class="k">Payment due (optional)</div><input id="idue" value="${esc(e?e.due:'')}" placeholder="dd/mm/yyyy"></div><div><div class="k">Notes / terms</div><input id="inote" value="${esc(e?e.notes:'')}" placeholder="e.g. 50% advance, balance on delivery"></div></div>`
 +`<button class="btn" type="button" onclick="${e?'upO('+e.id+')':'mk()'}">${e?'Save changes':'Create invoice'}</button>`}
const ppbOf=n=>{const p=S.prod.find(x=>x.name.toLowerCase()==String(n||'').trim().toLowerCase());return p?+p.pcs||0:0};
const rowQ=tr=>(+tr.querySelector('.ib').value||0)*ppbOf(tr.querySelector('.ip').value)+(+tr.querySelector('.iq').value||0);
const bxOf=i=>{if(i.bx!=null)return +i.bx;const b=ppbOf(i.p);return b?Math.floor(i.q/b):0};
function oiRow(v){
 v=v||{q:1,pr:''};const pb=ppbOf(v.p),bx=v.bx!=null?+v.bx:(pb?Math.floor(v.q/pb):0),pc=v.q-bx*pb;
 return `<tr><td class="c">1</td><td><input class="ip" list="oip" value="${esc(v.p||'')}" placeholder="Item / product name" oninput="oiAuto(this)"></td><td class="n"><input class="ib" type="number" min="0" value="${bx}" oninput="oiRec()"></td><td class="n"><input class="iq" type="number" min="0" value="${pc}" oninput="oiRec()"></td><td class="n"><input class="ipr" type="number" min="0" step="0.01" value="${v.pr}" placeholder="0.00" oninput="oiRate(this)"></td><td class="n ia">₹0</td><td class="c"><button class="ix" type="button" title="Remove this item" onclick="oiDel(this)">✕</button></td></tr>`}
function oiAuto(el){
 const r=el.closest('tr').querySelector('.ipr'),m=S.prod.find(p=>p.name.toLowerCase()==el.value.trim().toLowerCase());
 if(m&&(!r.value||r.dataset.auto=='1')){r.value=m.rate;r.dataset.auto='1'}
 oiRec()}
function oiRate(el){el.dataset.auto='';oiRec()}
function oiAdd(){const tb=$('#oib');tb.insertAdjacentHTML('beforeend',oiRow());tb.lastElementChild.querySelector('.ip').focus();oiRec()}
function oiDel(btn){if($('#oib').children.length<2)return alert('An invoice needs at least one item');btn.closest('tr').remove();oiRec()}
function oiRec(){
 let sub=0;
 document.querySelectorAll('#oib tr').forEach((tr,i)=>{
  tr.children[0].textContent=i+1;
  const a=rowQ(tr)*(+tr.querySelector('.ipr').value||0);
  tr.querySelector('.ia').textContent=fm(a);sub+=a});
 const d=Math.min(+$('#idisc').value||0,sub),gt=Math.round((sub-d)*(1+(+$('#itaxp').value||0)/100));
 $('#tsub').textContent=fm(sub);$('#tdisc').textContent='−'+fm(d);$('#ttax').textContent=fm(gt-(sub-d));$('#tgrand').textContent=fm(gt)}
function oiCust(){
 const n=$('#shop').value.trim(),c=S.c.find(x=>x.name.toLowerCase()==n.toLowerCase());
 $('#custinfo').innerHTML=c?`${esc(c.phone||'no phone')} ${esc(c.addr||'')} · due <span class="${cbal(c.name)>0?'bad':'ok'}">${fm(cbal(c.name))}</span>`
  :(n?'<span class="bad">Not saved under Customers — contact details will stay blank on the invoice</span>':'')}
async function mk(){
 const shop=$('#shop').value.trim(),date=$('#idate').value.trim()||today();
 const items=oiLines().filter(i=>i.p&&i.q>0);
 if(!shop)return alert('Enter the customer name');
 if(!pd(date))return alert('Use the invoice date format dd/mm/yyyy');
 if($('#idue').value.trim()&&!pd($('#idue').value.trim()))return alert('Payment due must be dd/mm/yyyy or left blank');
 if(!items.length)return alert('Add at least one item with a name and a quantity');
 const need={};items.forEach(i=>{const pr=S.prod.find(x=>x.name.toLowerCase()==i.p.toLowerCase());if(pr)need[pr.name]=(need[pr.name]||0)+i.q});
 const bad=Object.keys(need).map(n=>{const av=made(n)-sold(n);return av<=0?n+': out of stock':need[n]>av?`${n}: only ${nf(av)} in stock, you entered ${nf(need[n])}`:''}).filter(x=>x);
 if(bad.length)return alert('This order cannot be created.\n\n'+bad.join('\n')+'\n\nAdd production in Products & Stock first.');
 const sub=sum(items.map(i=>i.q*i.pr)),disc=Math.min(+$('#idisc').value||0,sub),taxp=+$('#itaxp').value||0;
 const {data,error}=await db.from('orders').insert({date,agent:$('#by').value,shop,items,disc,taxp,status:$('#ist').value,due:$('#idue').value.trim(),notes:$('#inote').value.trim()}).select().single();
 if(error)return fail(error);
 S.o.unshift(rO(data));R();done('Invoice '+rO(data).no+' saved for '+data.shop)}
function editO(id){const e=S.o.find(x=>x.id==id);if(!e)return;openM('Edit invoice '+e.no,()=>form(e),1);setTimeout(()=>{oiRec();oiCust()},0)}
async function upO(id){
 const e=S.o.find(x=>x.id==id);if(!e)return closeM();
 const shop=$('#shop').value.trim(),date=$('#idate').value.trim()||today(),due=$('#idue').value.trim();
 const items=oiLines().filter(i=>i.p&&i.q>0);
 if(!shop)return alert('Enter the customer name');
 if(!pd(date))return alert('Use the invoice date format dd/mm/yyyy');
 if(due&&!pd(due))return alert('Payment due must be dd/mm/yyyy or left blank');
 if(!items.length)return alert('Add at least one item with a name and a quantity');
 const old=e.items.slice();items.forEach(i=>{const k=old.findIndex(x=>x.p==i.p);if(k>-1){i.r=Math.min(+old[k].r||0,i.q);old.splice(k,1)}});
 const sub=sum(items.map(i=>i.q*i.pr)),disc=Math.min(+$('#idisc').value||0,sub),taxp=+$('#itaxp').value||0;
 const row={date,agent:$('#by').value,shop,items,disc,taxp,status:$('#ist').value,due,notes:$('#inote').value.trim()};
 const {error}=await db.from('orders').update(row).eq('id',id);
 if(error)return fail(error);
 Object.assign(e,{date,by:row.agent,shop,items,disc,taxp,st:row.status,due,notes:row.notes});R();done('Invoice '+e.no+' updated')}
function oiLines(){
 const out=[];
 document.querySelectorAll('#oib tr').forEach(tr=>out.push({p:tr.querySelector('.ip').value.trim(),q:rowQ(tr),bx:+tr.querySelector('.ib').value||0,pr:+tr.querySelector('.ipr').value||0,r:0}));
 return out}
async function stt(id,v){
 const {error}=await db.from('orders').update({status:v}).eq('id',id);
 if(error)return fail(error);
 S.o.find(x=>x.id==id).st=v;R()}
async function del(id){
 if(!await cfm('Delete this order?'))return;
 const {error}=await db.from('orders').delete().eq('id',id);
 if(error)return fail(error);
 S.o=S.o.filter(x=>x.id!=id);sel.delete(id);R();done('Order deleted')}
/* COLLECTION */
function Vc(){
 const p=S.s.filter(s=>s.st=='Pending');
 return `<div class="kp">${kp('Awaiting approval',fm(sum(p.map(s=>s.amt))),'bad')}${kp('Executive dues',fm(sum(ST().map(ebal))))}${kp('Customer payments',fm(sum(S.cp.filter(x=>x.st=='Settled').map(x=>x.amt))),'ok')}${kp('Customer dues',fm(sum(S.c.map(c=>cbal(c.name)))))}</div>
 <div class="chips">${['All','Pending','Settled','Cancelled'].map(x=>`<button class="${x==cf?'on':''}" onclick="cf='${x}';R()">${x}</button>`).join('')}</div>${dr(cdf,cdt,'cdf','cdt',clr('cdf','cdt'))}
 <input placeholder="🔍 Search customer, executive, amount, mode or date" value="${esc(qk)}" oninput="qk=this.value;$('#cx').innerHTML=cx()"><div id="cx">${cx()}</div>`}
function cx(){
 const k=qk.toLowerCase().trim(),inR=rng(cdf,cdt);
 const all=[...S.s.map(x=>({id:x.id,k:'s',t:x.ex+' · executive settlement',a:x.amt,m:x.mode,d:x.date,st:x.st,w:x.ex})),...S.cp.map(x=>({id:x.id,k:'cp',t:x.cust+' · customer payment'+(x.by?' · collected by '+x.by:'')+(x.inv?' · invoice '+x.inv:'')+(x.dis?' · discount '+fm(x.dis):'')+(x.rem?' · '+x.rem:''),a:x.amt,m:x.mode,d:x.date,st:x.st,w:x.cust+' '+x.by}))].filter(x=>(cf=='All'||x.st==cf)&&inR(x.d)&&hit(k,x.w,x.a,x.m,x.d)).sort((a,b)=>b.id-a.id);
 const card=x=>`<div class="card ost-${x.st}"><div class="top"><b>${fm(x.a)} · ${esc(x.m)}</b><span class="tag ${x.st}">${x.st}</span></div><div class="m">${esc(x.t)} · ${x.d}</div>${x.st=='Pending'?`<button class="btn" onclick="apc('${x.k}',${x.id},'Settled')">Settle</button><button class="btn d" onclick="apc('${x.k}',${x.id},'Cancelled')">Cancel</button>`:''}<button class="btn o" onclick="editColl('${x.k}',${x.id})">Edit</button><button class="btn d" onclick="delColl('${x.k}',${x.id})">Delete</button></div>`;
 return `${(cdf||cdt)?`<div class="m hint">${all.length} entry(ies)${rlab(cdf,cdt)} · ${fm(sum(all.filter(x=>x.k=='cp'&&x.st=='Settled').map(x=>x.a)))} settled from customers in range. The cards on top stay all-time.</div>`:''}<div class="m hint">Pending entries are added to the ledger only once settled.</div>${all.map(card).join('')||`<div class="empty">${k||cdf||cdt||cf!='All'?'Nothing matches this filter':'No collection entries yet'}</div>`}`}
function collRec(k,id){return (k=='s'?S.s:S.cp).find(x=>x.id==id)}
function editColl(k,id){const x=collRec(k,id);if(x)openM(k=='s'?'Edit Settlement':'Edit Collection',()=>collFields(x,k),1,1)}
const i2d=i=>{const [y,m,d]=String(i).split('-');return `${d}/${m}/${y}`};
const d2i=t=>{const m=String(t).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:tod()};
function collFields(x,k){
 const cp=k=='cp',val=x?(cp?x.cust:x.ex):'',L=cp?S.c.map(c=>c.name):[...ST()];if(val&&!L.includes(val))L.unshift(val);
 const sl=(id,o,c)=>`<select id="${id}">${o.map(v=>`<option ${v==c?'selected':''}>${v}</option>`).join('')}</select>`;
 return `<div class="cg"><div><div class="k rq">Date</div><input type="date" id="cd" value="${x?d2i(x.date):tod()}"></div>`
 +`<div><div class="k rq">${cp?'Customer':'Executive'}</div><select id="cw">${L.map(n=>`<option value="${esc(n)}" ${n==val?'selected':''}>${esc(n)}${cp?' (due '+fm(cbal(n))+')':''}</option>`).join('')||`<option value="">${cp?'Add a customer first':'Add staff first'}</option>`}</select></div>`
 +`<div><div class="k rq">Amount</div><input type="number" min="0" step="any" id="ca" value="${x?x.amt:''}"></div>`
 +(cp?`<div><div class="k">Cash Discount</div><input type="number" min="0" step="any" id="cdi" value="${x&&x.dis?x.dis:''}"></div><div><div class="k">Remarks</div><textarea id="crm" rows="1">${esc(x?x.rem:'')}</textarea></div><div><div class="k">Invoice</div><input id="cinv" value="${esc(x?x.inv:'')}" placeholder="Invoice no."></div>`:'')
 +`<div><div class="k rq">Payment Mode</div>${sl('cm',['Cash','UPI','Bank'],x?x.mode:'Cash')}</div><div><div class="k rq">Status</div>${sl('cst',['Pending','Settled','Cancelled'],x?x.st:'Pending')}</div>`
 +(cp?`<div><div class="k">Insert Staff</div><select id="cby">${bySel(x?x.by:'')}</select></div>`:'')
 +`</div><div class="cft"><button class="btn o" type="button" onclick="closeM()">Close</button><button class="btn cs" type="button" onclick="saveColl('${k}',${x?x.id:'null'})">Submit</button></div>`}
async function saveColl(k,id){
 const cp=k=='cp',x=id?collRec(k,id):null;
 const iso=$('#cd').value,w=$('#cw').value,a=+$('#ca').value||0,st=$('#cst').value,mode=$('#cm').value;
 if(!iso)return alert('Pick the date');if(!w)return alert('Select the '+(cp?'customer':'executive'));if(!(a>0))return alert('Enter the amount');
 const d=i2d(iso);let row,ext={};
 if(cp){const dis=+$('#cdi').value||0,rem=$('#crm').value.trim(),inv=$('#cinv').value.trim(),by=$('#cby').value;
  ext={by,dis,rem,inv};row={cust:w,amount:a,mode,date:d};
  if(st!='Settled'||(x&&x.st!='Settled'))row.status=st;
  if(dis||(x&&x.dis))row.discount=dis;if(rem||(x&&x.rem))row.remarks=rem;if(inv||(x&&x.inv))row.invoice=inv;if(by||(x&&x.by))row.collected_by=by||null}
 else row={ex:w,amount:a,mode,date:d,status:st};
 const t=cp?'payments':'settlements';
 if(x){const {error}=await db.from(t).update(row).eq('id',id);if(error)return pyfail(error);
  Object.assign(x,ext,{amt:a,mode,date:d,st});if(cp)x.cust=w;else x.ex=w;R();done('Entry updated')}
 else{const {data,error}=await db.from(t).insert(row).select().single();if(error)return pyfail(error);
  S.cp.unshift(rPay(data));R();done('Collection of '+fm(a)+' saved')}}
async function delColl(k,id){
 const x=collRec(k,id);if(!x)return;
 if(!await cfm(`Delete this ${k=='s'?'settlement':'collection'} of ${fm(x.amt)} (${x.date})?`))return;
 const {error}=await db.from(k=='s'?'settlements':'payments').delete().eq('id',id);
 if(error)return fail(error);
 if(k=='s')S.s=S.s.filter(p=>p.id!=id);else S.cp=S.cp.filter(p=>p.id!=id);
 R();done('Entry deleted')}
const bySel=v=>['',...S.st.map(x=>x.name),...(v&&!S.st.some(x=>x.name==v)?[v]:[])].map(n=>`<option value="${esc(n)}" ${n==v?'selected':''}>${n?esc(n):'Select Insert Staff'}</option>`).join('');
function pyfail(e){if(/collected_by|discount|remarks|invoice|status/i.test(err(e)))return alert('The payments table needs a few new columns. Run this once in Supabase > SQL Editor:\n\nalter table payments add column if not exists status text default \'Settled\', add column if not exists collected_by text, add column if not exists discount numeric, add column if not exists remarks text, add column if not exists invoice text;\n\nThen submit again.');return fail(e)}
async function apc(k,id,v){

 const {error}=await db.from(k=='s'?'settlements':'payments').update({status:v}).eq('id',id);

 x.st=v;R();toast(fm(x.amt)+' '+v.toLowerCase())}

function Vu(){
 return `<input placeholder="🔍 Search name, phone or address" value="${esc(qc)}" oninput="qc=this.value;$('#ul').innerHTML=ulList()"><div id="ul">${ulList()}</div>`}
function ulList(){

function custEditForm(c){return `<div class="k">Shop / customer name</div><input id="ecn" value="${esc(c.name)}"><div class="k">Phone</div><input id="ecph" value="${esc(c.phone||'')}"><div class="k">Address</div><input id="eca" value="${esc(c.addr||'')}"><div class="k">GST number (blank = B2C, filled = B2B)</div><input id="ecg" maxlength="15" value="${esc(c.gst||'')}" placeholder="15-character GSTIN" style="text-transform:uppercase"><button class="btn" onclick="updC(${c.id})">Save changes</button><button class="btn d" onclick="delC(${c.id})">Delete customer</button>`}
function editC(id){const c=S.c.find(x=>x.id==id);if(c)openM('Edit customer',()=>custEditForm(c))}
async function updC(id){
 const c=S.c.find(x=>x.id==id);if(!c)return closeM();
 const n=$('#ecn').value.trim();
 if(!n)return alert('Enter name');
 if(n.toLowerCase()!=c.name.toLowerCase()&&S.c.some(x=>x.id!=id&&x.name.toLowerCase()==n.toLowerCase()))return alert('Another customer already uses that name');
 const old=c.name,phone=$('#ecph').value.trim(),addr=$('#eca').value.trim(),g=$('#ecg').value.trim().toUpperCase();
 if(!gstOk(g))return alert('That GST number does not look right. A GSTIN has 15 characters, for example 32ABCDE1234F1Z5.');
 const {error}=await db.from('customers').update({name:n,phone,addr,...(g||c.gst?{gst:g}:{})}).eq('id',id);
 if(error)return gfail(error);
 if(old!=n){
  const [a,b]=await Promise.all([db.from('orders').update({shop:n}).eq('shop',old),db.from('payments').update({cust:n}).eq('cust',old)]);
  if(a.error||b.error)alert('Saved, but the old name is still on some records: '+(a.error||b.error).message);
  S.o.forEach(o=>{if(o.shop==old)o.shop=n});
  S.cp.forEach(p=>{if(p.cust==old)p.cust=n});
  if(lt=='Customer'&&le==old)le=n;
 }
 c.name=n;c.phone=phone;c.addr=addr;c.gst=g;byName(S.c);R();done('Customer updated')}
async function delC(id){
 const c=S.c.find(x=>x.id==id);if(!c)return;
 const n=S.o.filter(o=>o.shop==c.name).length,p=S.cp.filter(x=>x.cust==c.name).length;
 if(!await cfm(`Delete ${c.name}?${n||p?`\nTheir ${n} order(s) and ${p} payment(s) stay on record as text, but this customer card and its ledger entry will be removed.`:''}`))return;
 const {error}=await db.from('customers').delete().eq('id',id);
 if(error)return fail(error);

function pimgPick(inp){
 const file=inp.files&&inp.files[0];if(!file)return;
 if(!/^image\//.test(file.type)){inp.value='';return alert('Please choose an image file')}
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),cv=document.createElement('canvas');
   cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
   const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
   PIMG=cv.toDataURL('image/jpeg',0.82);$('#ppv').innerHTML=pprev()};
  im.onerror=()=>alert('Could not read that image');im.src=fr.result};
 fr.readAsDataURL(file)}

 else{led().filter(o=>o.by==le).forEach(o=>r.push({d:o.date,t:'Invoice '+o.no+' · '+o.shop,dr:tot(o),cr:0,id:o.id,k:0}));S.s.filter(s=>s.ex==le&&s.st=='Settled').forEach(s=>r.push({d:s.date,t:'Settlement ('+s.mode+')',dr:0,cr:s.amt,k:1,id:s.id}))}

/* PROFIT & LOSS + BALANCE SHEET */
function rawVal(asOf){
 const m={};
 S.pu.forEach(p=>{if(dnum(p.date)<=asOf){const x=m[p.material.toLowerCase()]||(m[p.material.toLowerCase()]={q:0,c:0,u:0});x.q+=+p.qty;x.c+=p.qty*p.rate}});
 S.cn.forEach(c=>{if(dnum(c.date)<=asOf){const x=m[c.material.toLowerCase()];if(x)x.u+=+c.qty}});
 return sum(Object.values(m).map(x=>x.q?Math.max(0,x.q-x.u)*(x.c/x.q):0))}
function plData(a,b){
 const A=dnum(a),B=dnum(b),inR=d=>inRange(d,A,B),L=led().filter(o=>inR(o.date));
 const sales=sum(L.map(o=>{const g=gross(o);return g-Math.min(+o.disc||0,g)}));
 const gst=sum(L.map(o=>{const g=gross(o);return tot(o)-(g-Math.min(+o.disc||0,g))}));
 const pur=sum(S.pu.filter(p=>inR(p.date)).map(p=>p.qty*p.rate));
 const m={};S.ex.filter(e=>inR(e.date)).forEach(e=>{const k=String(e.category||'Other').trim()||'Other';m[k]=(m[k]||0)+(+e.amount||0)});
 const xc=Object.entries(m).sort((x,y)=>y[1]-x[1]),dis=sum(S.cp.filter(p=>p.st=='Settled'&&inR(p.date)).map(p=>p.dis||0));
 const open=a?rawVal(A-1):0,close=rawVal(b?B:Infinity),gp=sales+close-open-pur,exp=sum(xc.map(x=>x[1]))+dis;
 return {sales,gst,pur,xc,dis,open,close,gp,exp,np:gp-exp}}
function tform(L,R2,lt,rt){
 const n=Math.max(L.length,R2.length),pad=a=>[...a,...Array(n-a.length).fill(['',null])],l=pad(L),r=pad(R2);
 const cell=x=>`<td>${esc(x[0])}</td><td class="n">${x[1]==null?'':money(x[1])}</td>`;
 return `<div class="tw"><table class="tf"><tr><th>${lt}</th><th class="n">₹</th><th>${rt}</th><th class="n">₹</th></tr>${l.map((x,i)=>`<tr>${cell(x)}${cell(r[i])}</tr>`).join('')}<tr class="tbg"><td>Total</td><td class="n">${money(sum(L.map(x=>x[1])))}</td><td>Total</td><td class="n">${money(sum(R2.map(x=>x[1])))}</td></tr></table></div>`}
function plTable(d){
 const L=[...(d.open>0?[['Opening stock — raw materials',d.open]]:[]),['Purchases — raw materials',d.pur],...d.xc.map(x=>[x[0],x[1]]),...(d.dis?[['Cash discount allowed',d.dis]]:[]),...(d.np>=0?[['Net profit',d.np]]:[])];
 const R2=[['Sales (net of returns and discount, excluding GST)',d.sales],...(d.close>0?[['Closing stock — raw materials',d.close]]:[]),...(d.np<0?[['Net loss',-d.np]]:[])];
 return tform(L,R2,'Expenses','Income')}
const plNote='Sales exclude GST (the GST collected is a liability on the Balance Sheet). Finished-goods stock is not valued because product cost is not recorded. Purchases and expenses are counted when entered.';

function bsData(){
 const d=plData('',''),names=[...new Set([...S.c.map(c=>c.name),...S.o.map(o=>o.shop),...S.cp.map(p=>p.cust)])];
 const deb=sum(names.map(n=>Math.max(0,cbal(n)))),adv=sum(names.map(n=>Math.max(0,-cbal(n))));
 const cash=sum(S.cp.filter(p=>p.st=='Settled').map(p=>p.amt))-d.pur-sum(d.xc.map(x=>x[1]));
 const L=[...(d.np>=0?[['Net profit (retained)',d.np]]:[]),['GST payable (output GST collected)',d.gst],['Customer advances (credit balances)',adv],...(cash<0?[['Funds introduced (spent more than received)',-cash]]:[])];
 const A=[['Closing stock — raw materials',d.close],['Sundry debtors (customers)',deb],['Cash & bank (receipts − purchases − expenses)',Math.max(0,cash)],...(d.np<0?[['Net loss',-d.np]]:[])];
 return {L,A,deb,cash,gst:d.gst,tl:sum(A.map(x=>x[1]))}}

const STN={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh'};
const money=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const balTxt=n=>{n=Math.round(n*100)/100;return n>0?money(n)+' Dr':n<0?money(-n)+' Cr':'0 Cr'};
function invSheet(o,btn){
 const c=S.c.find(x=>x.name==o.shop),b2b=!!(c&&c.gst),ty=b2b?'B2B':'B2C',tp=+o.taxp||0;
 const rt=sum(o.items.map(i=>i.r*i.pr)),g=gross(o),d=Math.min(+o.disc||0,g),t=tot(o)-(g-d),hb=o.items.some(i=>bxOf(i)>0);
 const A=dnum(o.date),L=S.o.filter(x=>x.shop==o.shop&&x.st!='Pending'&&x.st!='Cancelled'),P=S.cp.filter(x=>x.cust==o.shop&&x.st=='Settled');
 const prev=sum(L.filter(x=>dnum(x.date)<A).map(tot))-sum(P.filter(x=>dnum(x.date)<A).map(x=>x.amt+(x.dis||0)));
 const sales=[[ty+' SALE - '+o.no,tot(o)],...L.filter(x=>dnum(x.date)==A&&x.id!=o.id).map(x=>[ty+' SALE - '+x.no,tot(x)])];
 const rc=P.filter(x=>dnum(x.date)==A).flatMap(x=>[['Receipt - '+x.id,x.amt],...(x.dis?[['Cash discount - '+x.id,x.dis]]:[])]);
 const net=prev+sum(sales.map(v=>v[1]))-sum(rc.map(v=>v[1]));
 const kv=(k,v,b)=>`<div class="kv${b?' b':''}"><span>${k}</span><span>${v}</span></div>`;
 const cols=hb?12:11;
 const rows=o.items.map((i,n)=>{const pr=S.prod.find(x=>x.name==i.p)||{},tx=i.q*i.pr;return `<tr><td class="c">${n+1}</td><td>${esc(pr.hsn||'')}</td><td>${esc(i.p)}</td><td class="r">${i.q}</td>${hb?`<td class="r">${bxOf(i)||''}</td>`:''}<td class="c">${esc(pr.uom||'PCS')}</td><td class="r">${money(i.pr)}</td><td class="r">${money(i.pr*(1+tp/100))}</td><td class="r">0.00</td><td class="r">${money(tx)}</td><td class="c">${tp}</td><td class="r">${money(tx*(1+tp/100))}</td></tr>`}).join('');
 const now=new Date(),pdt=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' Time: '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
 return `<div class="sheet tx"><div class="bx"><div class="hd1"><h2>${esc(CO.name)}</h2>${CO.addr?`<div>${esc(CO.addr)}</div>`:''}${CO.phone?`<div>PH: ${esc(CO.phone)}</div>`:''}${CO.email?`<div>Email: ${esc(CO.email)}</div>`:''}</div>${CO.gst?`<div class="gs">GSTIN: ${esc(CO.gst)}</div>`:''}`
 +`<div class="two"><div>${CO.fssai?`<div>FSSAI LICENSE NO : ${esc(CO.fssai)}</div>`:''}<div><b><u>Details of Receiver(Billed to)</u></b></div><div>Name: ${esc(o.shop)}</div><div>Address: ${esc(c?c.addr:'')}</div><div>State: ${esc(c&&c.gst?STN[c.gst.slice(0,2)]||'':'')}</div><div>Mobile: ${esc(c?c.phone:'')}</div>${c&&c.gst?`<div>GSTIN No: ${esc(c.gst)}</div>`:''}</div>`
 +`<div><div><b><u>TAX INVOICE</u></b></div><div>Invoice No : ${esc(o.no)}</div><div>Invoice Date : ${esc(o.date)}</div><div>Invoice Type : ${ty} SALE</div><div>Sales Man : ${esc(o.by)}</div><div>Remarks : ${esc(o.notes||'')}</div>${o.due?`<div>Payment Due : ${esc(o.due)}</div>`:''}</div></div>`
 +`<table class="itx"><thead><tr><th>s no</th><th>HSN</th><th>Product</th><th>Qty</th>${hb?'<th>Box</th>':''}<th>UOM</th><th>Rate<br>(Excl Tax)</th><th>Rate<br>(Incl Tax)</th><th>Disc<br>%</th><th>Taxable<br>Amount</th><th>Gst<br>%</th><th>Amount</th></tr></thead><tbody>${rows}<tr class="sp">${'<td></td>'.repeat(cols)}</tr></tbody><tfoot><tr><td colspan="3"></td><td class="r">${sum(o.items.map(i=>i.q))}</td><td colspan="${cols-5}"></td><td class="r">${money(sum(o.items.map(i=>i.q*i.pr*(1+tp/100))))}</td></tr></tfoot></table>`
 +`<div class="bt"><div class="bl"><div><b><u>Amount In Words</u></b></div><div>(${words(tot(o))})</div><div class="bk"><div><div><b><u>Bank Details</u></b></div>${CO.bank?`<div>Bank Name : ${esc(CO.bank)}</div>`:''}${CO.branch?`<div>Branch : ${esc(CO.branch)}</div>`:''}${CO.acno?`<div>A/c No : ${esc(CO.acno)}</div>`:''}${CO.ifsc?`<div>IFSC : ${esc(CO.ifsc)}</div>`:''}</div>${CO.qr?`<div class="qr"><img src="${esc(CO.qr)}" alt=""><div>Scan&amp;Pay</div></div>`:''}</div></div>`
 +`<div class="br">${rt?kv('Less: Returns','−'+money(rt)):''}${kv('Gross Value',money(g))}${kv('Total CGST',money(t/2))}${kv('Total SGST',money(t/2))}${kv('Total GST',money(t))}${kv('Bill Discount',money(d))}${kv('Grand Total',money(tot(o)),1)}${kv('Previous Day Balance',balTxt(prev))}<div class="kv b"><span><u>Today's Vouchers :</u></span></div>${[...sales,...rc].map(v=>kv(esc(v[0]),money(v[1]))).join('')}${kv('Net Amount',balTxt(net),1)}</div></div>`
 +`<div class="sg"><div>For, ${esc(CO.name)}</div><div class="as">Authorised Signatory</div></div></div><div class="pdt">Printed Date: ${pdt}</div>`
 +(btn?`<button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button>`:'')+`</div>`}
function words(n){
 n=Math.round(+n||0);if(!n)return 'Zero';
 const ONE=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const TEN=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const t2=v=>v<20?ONE[v]:TEN[Math.floor(v/10)]+(v%10?' '+ONE[v%10]:'');
 const t3=v=>[(v>=100?ONE[Math.floor(v/100)]+' Hundred':''),(v%100?t2(v%100):'')].filter(s=>s).join(' ');
 let out=[],r=n;
 if(r>=10000000){out.push(t2(Math.floor(r/10000000))+' Crore');r%=10000000}
 if(r>=100000){out.push(t2(Math.floor(r/100000))+' Lakh');r%=100000}
 if(r>=1000){out.push(t2(Math.floor(r/1000))+' Thousand');r%=1000}
 if(r>0)out.push(t3(r));
 return out.join(' ')}
