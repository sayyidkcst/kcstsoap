   q('settlements'),q('payments'),

  applyData(d);

  if(!hit||!MF)R();
 }catch(e){if(!hit)$('#app').innerHTML=accBar()+`<div class="card"><b>Could not load data</b><div class="m" style="margin-top:6px">${esc(err(e))}</div><button class="btn" onclick="sync()">Retry</button></div>`}

  ext={by,dis,rem,inv};row={cust:w,amount:a,mode,date:d};

 else{const {data,error}=await db.from(t).insert(row).select().single();if(error)return pyfail(error);

 +`<div><div class="k rq" id="bql">Quantity${cur=='g'?' (grams)':''}</div><input type="number" min="0" step="any" id="bq" value="${x?x.qty:''}" oninput="buAmt()"><div class="m" id="bqh" style="margin:-2px 0 0"></div></div>`

 +`<div><div class="k rq" id="brl">Rate (₹ per ${kg?'kg':'unit'})</div><input type="number" min="0" step="any" id="br" value="${x?x.rate:''}" oninput="buAmt()"></div>`

const buQ=()=>{const q=+$('#bq').value||0;return $('#bu').value=='g'?+(q/1000).toFixed(6):q};
function buUnit(){
 const sel=$('#bu'),u=sel.value,old=sel.dataset.u||u,kg=u=='kg'||u=='g',q=+$('#bq').value||0;
 if(q&&old!=u&&(old=='kg'||old=='g')&&(u=='kg'||u=='g'))$('#bq').value=+(u=='g'?q*1000:q/1000).toFixed(6);
 sel.dataset.u=u;
 $('#bql').textContent='Quantity'+(u=='g'?' (grams)':'');
 $('#brl').textContent='Rate (₹ per '+(kg?'kg':'unit')+')';
 buAmt()}
function buAmt(){const q=buQ(),a=q*(+$('#br').value||0);$('#ba').value=a>0?fm(Math.round(a)):'';const h=$('#bqh');if(h)h.textContent=$('#bu').value=='g'&&q>0?'= '+qkg(q)+' kg':''}
function buAuto(){const m=mats().find(x=>x.name.toLowerCase()==$('#bm').value.trim().toLowerCase());if(!m||!m.unit)return;const u=String(m.unit).toLowerCase();if(u=='kg')return;const o=[...$('#bu').options].find(o=>o.value.toLowerCase()==u);if(o){$('#bu').value=o.value;buUnit()}}

const asDay=d=>Date.parse(String(d||'').slice(0,10));
const asCats=()=>[...new Set(['Machinery','Furniture','Computer & IT','Vehicle','Building','Equipment','Other',...S.as.map(a=>a.category).filter(v=>v)])];
function asVal(a,ms){const t0=asDay(a.date);if(!(t0<=ms))return null;const yrs=(ms-t0)/(365.25*864e5),r=Math.min(Math.max(+a.dep_rate||0,0),100)/100,cost=+a.cost||0,v=cost*Math.pow(1-r,yrs);return {value:v,dep:cost-v}}

const asDep=ms=>sum(S.as.map(a=>{const x=asVal(a,ms);return x?x.dep:0}));
const asCost=ms=>sum(S.as.filter(a=>asDay(a.date)<=ms).map(a=>+a.cost||0));
function asRange(a,b){const e=b?asDay(b):Date.now(),o=a?asDay(a)-864e5:-Infinity;return Math.max(0,asDep(e)-(o===-Infinity?0:asDep(o)))}

 const m=mats(),av=x=>x.pq?x.pc/x.pq:0,rm={};m.forEach(x=>rm[x.name.toLowerCase()]=av(x));
 const cr=c=>+c.rate>0?+c.rate:(rm[String(c.material||'').toLowerCase()]||0);

 return sqlHint()+`<div class="kp">${kp('Materials',m.length)}${kp('Consumption entries',S.cn.length)}${kp('Consumed value',fm(Math.round(cval)))}${kp('Stock value',fm(Math.round(sum(m.map(x=>(x.pq-x.cq)*av(x))))))}${kp('Low / out',m.filter(x=>x.pq-x.cq<=0).length,'bad')}</div>`

 +`<h4>Consumption history <span class="m">· total ${fm(Math.round(cval))}</span></h4><div class="card"><div class="tw"><table><tr><th>Date</th><th>Material</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th><th>Used for</th><th></th></tr>${S.cn.map(c=>{const r=cr(c);return `<tr><td>${dm(c.date)||esc(c.date)}</td><td>${esc(c.material)}</td><td class="n">${qfmt(c.qty,c.unit)}</td><td class="n">${fm(Math.round(r*100)/100)}</td><td class="n">${fm(Math.round((+c.qty||0)*r))}</td><td>${esc(c.notes||'')}</td>${dbtn('consumption',c.id,'cn')}</tr>`}).join('')||empty(7,'No consumption entries yet')}</table></div></div>`}

const PAL=['#2563eb','#0891b2','#d49b2c','#8b5cc4','#d1495b','#00897b','#ef6c00','#6d4c41'];
const scol=n=>PAL[Math.max(0,S.st.findIndex(x=>x.name==n))%PAL.length];
const iso2=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function calGo(n){let m=RC.m+n,y=RC.y;if(m<0){m=11;y--}if(m>11){m=0;y++}RC.m=m;RC.y=y;R()}
function Vcal(){
 const {y,m,s:f}=RC,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,pre=iso2(y,m,1).slice(0,7),by={};
 S.rt.filter(r=>(f=='All'||r.staff==f)&&String(r.date).slice(0,7)==pre).forEach(r=>{const d=+String(r.date).slice(8,10);(by[d]=by[d]||[]).push(r)});

function rawVal(asOf){
 const m={};
 S.pu.forEach(p=>{if(dnum(p.date)<=asOf){const x=m[p.material.toLowerCase()]||(m[p.material.toLowerCase()]={q:0,c:0,u:0});x.q+=+p.qty;x.c+=p.qty*p.rate}});
 S.cn.forEach(c=>{if(dnum(c.date)<=asOf){const x=m[c.material.toLowerCase()];if(x)x.u+=+c.qty}});
 return sum(Object.values(m).map(x=>x.q?Math.max(0,x.q-x.u)*(x.c/x.q):0))}
function plData(a,b){
 const A=dnum(a),B=dnum(b),inR=d=>inRange(d,A,B),L=led().filter(o=>inR(o.date));
 const sales=sum(L.map(o=>{const g=gross(o);return g-Math.min(+o.disc||0,g)}));
 const gst=sum(L.map(o=>{const g=gross(o);return tot(o)-(g-Math.min(+o.disc||0,g))}));
 const pur=sum(S.pu.filter(p=>inR(p.date)).map(p=>p.qty*p.rate));
 const m={};S.ex.filter(e=>inR(e.date)).forEach(e=>{const k=String(e.category||'Other').trim()||'Other';m[k]=(m[k]||0)+(+e.amount||0)});
 const xc=Object.entries(m).sort((x,y)=>y[1]-x[1]),dis=sum(S.cp.filter(p=>p.st=='Settled'&&inR(p.date)).map(p=>p.dis||0));
 const dep=Math.round(asRange(a,b));if(dep>0)xc.push(['Depreciation',dep]);
 const open=a?rawVal(A-1):0,close=rawVal(b?B:Infinity),gp=sales+close-open-pur,exp=sum(xc.map(x=>x[1]))+dis;
 return {sales,gst,pur,xc,dep,dis,open,close,gp,exp,np:gp-exp}}

 return `<div class="tw"><table class="tf"><tr><th>${lt}</th><th class="n">₹</th><th>${rt}</th><th class="n">₹</th></tr>${l.map((x,i)=>`<tr>${cell(x)}${cell(r[i])}</tr>`).join('')}<tr class="tbg"><td>Total</td><td class="n">${money(sum(L.map(x=>x[1])))}</td><td>Total</td><td class="n">${money(sum(R2.map(x=>x[1])))}</td></tr></table></div>`}
function plTable(d){
 const L=[...(d.open>0?[['Opening stock — raw materials',d.open]]:[]),['Purchases — raw materials',d.pur],...d.xc.map(x=>[x[0],x[1]]),...(d.dis?[['Cash discount allowed',d.dis]]:[]),...(d.np>=0?[['Net profit',d.np]]:[])];
 const R2=[['Sales (net of returns and discount, excluding GST)',d.sales],...(d.close>0?[['Closing stock — raw materials',d.close]]:[]),...(d.np<0?[['Net loss',-d.np]]:[])];
 return tform(L,R2,'Expenses','Income')}

let LSD={v:'',d:'',r:''};
function lsOrders(){return S.o.filter(o=>sel.has(o.id)&&o.st!='Cancelled').sort((a,b)=>a.id-b.id)}
function lsOpen(){
 const l=lsOrders();if(!l.length)return alert('Tick at least one order first (cancelled orders are skipped)');
 openM('Loading slip',()=>`<div class="m" style="margin-bottom:8px">${l.length} invoice(s) · ${fm(sum(l.map(tot)))} · pick the vehicle this load goes on.</div><div class="cg"><div style="grid-column:span 2"><div class="k rq">Vehicle number</div><input id="lsv" value="${esc(LSD.v)}" placeholder="e.g. KL 10 AB 1234" style="text-transform:uppercase"></div><div style="grid-column:span 2"><div class="k">Driver name</div><input id="lsd" value="${esc(LSD.d)}" placeholder="Driver / helper"></div><div style="grid-column:span 2"><div class="k">Date</div><input id="lsdt" value="${today()}" placeholder="dd/mm/yyyy"></div><div style="grid-column:span 2"><div class="k">Route / destination</div><input id="lsr" value="${esc(LSD.r)}" placeholder="e.g. Kozhikode route"></div></div><div class="cft"><button class="btn o" type="button" onclick="closeM()">Close</button><button class="btn cs" type="button" onclick="lsPrint()">Make slip</button></div>`,0,1)}
function lsPrint(){
 const v=$('#lsv').value.trim().toUpperCase(),dr=$('#lsd').value.trim(),dt=$('#lsdt').value.trim()||today(),rt=$('#lsr').value.trim();
 if(!v)return alert('Enter the vehicle number');
 LSD={v,d:dr,r:rt};const l=lsOrders();closeM();
 const m={};
 l.forEach(o=>o.items.forEach(i=>{if(!(i.q>0))return;const k=i.p.toLowerCase(),x=m[k]||(m[k]={p:i.p,q:0,bx:0,a:0});x.q+=i.q;x.bx+=bxOf(i);x.a+=i.q*i.pr*(1+lineGst(i,o)/100)}));
 const P=Object.values(m).sort((a,b)=>a.p.localeCompare(b.p)),hb=P.some(x=>x.bx>0);
 const info=n=>S.prod.find(x=>x.name.toLowerCase()==n.toLowerCase())||{};
 const tq=sum(P.map(x=>x.q)),tb=sum(P.map(x=>x.bx)),ta=sum(P.map(x=>x.a)),tv=sum(l.map(tot));
 const pdt=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' Time: '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
  $('#inv').innerHTML=`<div class="np ivbar"><b>Loading slip · ${esc(v)} · ${l.length} invoice${l.length>1?'s':''}</b><span class="pgnote">prints on A4 paper</span><button class="btn" onclick="print()">Print</button><button class="btn o" onclick="$('#inv').hidden=true">Close</button></div>`
 +`<div class="sheet tx a4 ls"><div class="bx"><div class="ich"><h2>${esc(CO.name)}</h2>${CO.addr?`<div class="ad">${esc(CO.addr)}</div>`:''}${CO.phone?`<div class="ad">Ph: ${esc(CO.phone)}</div>`:''}</div><div class="band">Loading Slip</div>`
 +`<div class="two"><div><div class="lbl">Vehicle</div><div class="bn">${esc(v)}</div>${dr?`<div class="ln">Driver: <b>${esc(dr)}</b></div>`:''}${rt?`<div class="ln">Route: ${esc(rt)}</div>`:''}</div><div><div class="lbl">Load summary</div><div class="mt"><span>Date</span><b>${esc(dt)}</b></div><div class="mt"><span>Invoices</span><b>${l.length}</b></div><div class="mt"><span>Products</span><b>${P.length}</b></div><div class="mt"><span>Total quantity</span><b>${nf(tq)}</b></div><div class="mt"><span>Load value</span><b>${money(tv)}</b></div></div></div>`
 +`<div class="lbl" style="margin:8px 12px 3px">Products to load</div><table class="itx"><thead><tr><th>✓</th><th>S.no</th><th>Product</th><th>HSN</th>${hb?'<th>Box</th>':''}<th>Qty</th><th>UOM</th><th>Amount<br>(incl. GST)</th></tr></thead><tbody>${P.map((x,n)=>`<tr><td class="c">☐</td><td class="c">${n+1}</td><td class="pn">${esc(x.p)}</td><td>${esc(info(x.p).hsn||'')}</td>${hb?`<td class="r">${x.bx||''}</td>`:''}<td class="r"><b>${nf(x.q)}</b></td><td class="c">${esc(info(x.p).uom||'PCS')}</td><td class="r">${money(x.a)}</td></tr>`).join('')}<tr class="tot"><td colspan="4" class="r">Total</td>${hb?`<td class="r">${tb||''}</td>`:''}<td class="r">${nf(tq)}</td><td></td><td class="r">${money(ta)}</td></tr></tbody></table>`
 +`<div class="lbl" style="margin:10px 12px 3px">Invoices on this vehicle</div><table class="itx"><thead><tr><th>S.no</th><th>Invoice no.</th><th>Date</th><th>Customer</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${l.map((o,n)=>`<tr><td class="c">${n+1}</td><td>${esc(o.no)}</td><td class="c">${esc(o.date)}</td><td class="pn">${esc(o.shop)}</td><td class="r">${nf(sum(o.items.map(i=>i.q)))}</td><td class="r">${money(tot(o))}</td></tr>`).join('')}<tr class="tot"><td colspan="4" class="r">Total invoice value</td><td class="r">${nf(sum(l.map(o=>sum(o.items.map(i=>i.q)))))}</td><td class="r">${money(tv)}</td></tr></tbody></table>`
 +`<div class="m3"></div><div class="ft"><div class="sg"><div style="height:34px"></div><div class="as">Prepared by</div></div><div class="sg"><div style="height:34px"></div><div class="as">Loaded by</div></div><div class="sg"><div style="height:34px"></div><div class="as">Driver signature</div></div></div></div><div class="pdt">Printed Date: ${pdt}</div></div>`;
 $('#inv').hidden=false;$('#inv').scrollTop=0}
function invMulti(){
 const l=S.o.filter(o=>sel.has(o.id)).sort((a,b)=>a.id-b.id);
 if(!l.length)return alert('Tick at least one order first');
 $('#inv').innerHTML=`<div class="np ivbar"><b>${l.length} invoice${l.length>1?'s':''} · one per page</b><span class="pgnote">${(n4=>`${n4?n4+' × A4 (B2B)':''}${n4&&l.length-n4?' · ':''}${l.length-n4?(l.length-n4)+' × A5 (B2C)':''}`)(l.filter(o=>{const c=S.c.find(x=>x.name==o.shop);return c&&c.gst}).length)}</span><button class="btn" onclick="print()">Print all</button><button class="btn o" onclick="$('#inv').hidden=true">Close</button></div>`+l.map(o=>invSheet(o)).join('');
 $('#inv').hidden=false;$('#inv').scrollTop=0}
const STN={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh'};
const money=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const balTxt=n=>{n=Math.round(n*100)/100;return n>0?money(n)+' Dr':n<0?money(-n)+' Cr':'0 Cr'};
function invSheet(o,btn){
 const c=S.c.find(x=>x.name==o.shop),b2b=!!(c&&c.gst),ty=b2b?'B2B':'B2C';
 const rt=sum(o.items.map(i=>i.r*i.pr)),g=gross(o),d=Math.min(+o.disc||0,g),t=tot(o)-(g-d),hb=o.items.some(i=>bxOf(i)>0);
 const A=dnum(o.date),L=S.o.filter(x=>x.shop==o.shop&&x.st!='Pending'&&x.st!='Cancelled'),P=S.cp.filter(x=>x.cust==o.shop&&x.st=='Settled');
 const prev=sum(L.filter(x=>dnum(x.date)<A).map(tot))-sum(P.filter(x=>dnum(x.date)<A).map(x=>x.amt+(x.dis||0)));
 const sales=[[ty+' SALE - '+o.no,tot(o)],...L.filter(x=>dnum(x.date)==A&&x.id!=o.id).map(x=>[ty+' SALE - '+x.no,tot(x)])];
 const rc=P.filter(x=>dnum(x.date)==A).flatMap(x=>[['Receipt - '+x.id,x.amt],...(x.dis?[['Cash discount - '+x.id,x.dis]]:[])]);
 const net=prev+sum(sales.map(v=>v[1]))-sum(rc.map(v=>v[1]));
 const kv=(k,v,b)=>`<div class="kv${b?' '+b:''}"><span>${k}</span><span>${v}</span></div>`;
 const a5=!b2b,cols=a5?(hb?10:9):(hb?12:11);
 const rows=o.items.map((i,n)=>{const pr=S.prod.find(x=>x.name==i.p)||{},tx=i.q*i.pr,gp=lineGst(i,o);return `<tr><td class="c">${n+1}</td><td>${esc(pr.hsn||'')}</td><td class="pn">${esc(i.p)}</td><td class="r">${i.q}</td>${hb?`<td class="r">${bxOf(i)||''}</td>`:''}<td class="c">${esc(pr.uom||'PCS')}</td><td class="r">${money(i.pr)}</td>${a5?'':`<td class="r">${money(i.pr*(1+gp/100))}</td><td class="r">0.00</td>`}<td class="r">${money(tx)}</td><td class="c">${gp}</td><td class="r">${money(tx*(1+gp/100))}</td></tr>`}).join('');
 const now=new Date(),pdt=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' Time: '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
 return `<div class="sheet tx ${a5?'a5':'a4'}"><div class="bx"><div class="ich"><h2>${esc(CO.name)}</h2>${CO.tag?`<div class="tg">${esc(CO.tag)}</div>`:''}${CO.addr?`<div class="ad">${esc(CO.addr)}</div>`:''}${(CO.phone||CO.email)?`<div class="ad">${[CO.phone?'Ph: '+esc(CO.phone):'',CO.email?esc(CO.email):''].filter(x=>x).join(' &nbsp;|&nbsp; ')}</div>`:''}${(CO.gst||CO.fssai)?`<div class="ids">${CO.gst?`<span>GSTIN: ${esc(CO.gst)}</span>`:''}${CO.fssai?`<span>FSSAI: ${esc(CO.fssai)}</span>`:''}</div>`:''}</div><div class="band">Tax Invoice</div>`
+`<div class="two"><div><div class="lbl">Billed to</div><div class="bn">${esc(o.shop)}</div>${c&&c.addr?`<div class="ln">${esc(c.addr)}</div>`:''}${c&&c.gst?`<div class="ln">State: ${esc(STN[c.gst.slice(0,2)]||'')}</div>`:''}${c&&c.phone?`<div class="ln">Mobile: ${esc(c.phone)}</div>`:''}${c&&c.gst?`<div class="ln"><b>GSTIN: ${esc(c.gst)}</b></div>`:''}</div><div><div class="lbl">Invoice details</div><div class="mt"><span>Invoice no.</span><b>${esc(o.no)}</b></div><div class="mt"><span>Date</span><b>${esc(o.date)}</b></div><div class="mt"><span>Type</span><b>${ty} SALE</b></div><div class="mt"><span>Sales man</span><b>${esc(o.by)}</b></div>${o.due?`<div class="mt"><span>Payment due</span><b>${esc(o.due)}</b></div>`:''}${o.notes?`<div class="mt"><span>Remarks</span><b>${esc(o.notes)}</b></div>`:''}</div></div>`
+`<table class="itx" style="height:${Math.max(a5?30:50,(a5?64:108)-(a5?3.4:4.6)*(Math.max(0,sales.length+rc.length-1)+(rt?1:0)))}mm"><thead><tr><th>S.no</th><th>HSN</th><th>Product</th><th>Qty</th>${hb?'<th>Box</th>':''}<th>UOM</th><th>Rate<br>(Excl Tax)</th>${a5?'':'<th>Rate<br>(Incl Tax)</th><th>Disc<br>%</th>'}<th>Taxable<br>Amount</th><th>Gst<br>%</th><th>Amount</th></tr></thead><tbody>${rows}<tr class="sp">${'<td></td>'.repeat(cols)}</tr><tr class="tot"><td colspan="3" class="r">Total</td><td class="r">${sum(o.items.map(i=>i.q))}</td><td colspan="${cols-5}"></td><td class="r">${money(sum(o.items.map(i=>i.q*i.pr*(1+lineGst(i,o)/100))))}</td></tr></tbody></table>`
+`<div class="bt"><div class="bl"><div class="lbl">Amount in words</div><div class="wd">${words(tot(o))} Rupees Only</div>${(CO.bank||CO.branch||CO.acno||CO.ifsc||CO.qr)?`<div class="bank"><div class="bk"><div class="lbl" style="border:0;margin:0">Bank details</div>${CO.bank?`<div><i>Bank Name</i>: ${esc(CO.bank)}</div>`:''}${CO.branch?`<div><i>Branch</i>: ${esc(CO.branch)}</div>`:''}${CO.acno?`<div><i>A/C No</i>: <b>${esc(CO.acno)}</b></div>`:''}${CO.ifsc?`<div><i>IFSC</i>: ${esc(CO.ifsc)}</div>`:''}</div>${CO.qr?`<div class="qrbox">Scan &amp; Pay<img src="${esc(CO.qr)}" alt=""></div>`:''}</div>`:''}</div>`
+`<div class="br">${rt?kv('Less: Returns','−'+money(rt)):''}${kv('Gross Value',money(g))}${kv('Total CGST',money(t/2))}${kv('Total SGST',money(t/2))}${kv('Total GST',money(t),'b')}${kv('Bill Discount',money(d))}${kv('Grand Total',money(tot(o)),'b gt')}${kv('Previous Day Balance',balTxt(prev))}${kv("Today's Vouchers",'','b vh')}${[...sales,...rc].map(v=>kv(esc(v[0]),money(v[1]))).join('')}${kv('Net Amount',balTxt(net),'b dn')}</div></div>`
+`<div class="ft"><div class="tn">Thank you for your business.<br>Goods once sold will not be taken back without prior approval.</div><div class="sg"><div>For, ${esc(CO.name)}</div><div class="as">Authorised Signatory</div></div></div></div>`
+`<div class="pdt">Printed Date: ${pdt}</div>`
+(btn?`<span class="pgnote np">${ty} · prints on ${a5?'A5':'A4'} paper</span><button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button>`:'')+`</div>`}
function words(n){
 n=Math.round(+n||0);if(!n)return 'Zero';
 const ONE=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const TEN=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const t2=v=>v<20?ONE[v]:TEN[Math.floor(v/10)]+(v%10?' '+ONE[v%10]:'');
 const t3=v=>[(v>=100?ONE[Math.floor(v/100)]+' Hundred':''),(v%100?t2(v%100):'')].filter(s=>s).join(' ');
 let out=[],r=n;
 if(r>=10000000){out.push(t2(Math.floor(r/10000000))+' Crore');r%=10000000}
 if(r>=100000){out.push(t2(Math.floor(r/100000))+' Lakh');r%=100000}
 if(r>=1000){out.push(t2(Math.floor(r/1000))+' Thousand');r%=1000}
 if(r>0)out.push(t3(r));
 return out.join(' ')}
