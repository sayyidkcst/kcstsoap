<script>
const SUP_URL='https://yrvpfbsbbpfpkpnhzxyi.supabase.co';
const SUP_KEY='sb_publishable_8JL0NpLprDRGpJu5sMw61Q_mPM-MimE';
const db=window.supabase?window.supabase.createClient(SUP_URL,SUP_KEY,{auth:{persistSession:false}}):null;

const $=s=>document.querySelector(s);
const fm=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hit=(k,...v)=>!k||v.join(' ').toLowerCase().includes(k);
const sum=a=>a.reduce((x,y)=>x+y,0);
const gross=o=>sum(o.items.map(i=>(i.q-i.r)*i.pr));
const tot=o=>{const g=gross(o),d=Math.min(+o.disc||0,g);return Math.round((g-d)*(1+(+o.taxp||0)/100))};
const live=()=>S.o.filter(o=>o.st!='Cancelled');
const ebal=e=>sum(live().filter(o=>o.by==e).map(tot))-sum(S.s.filter(s=>s.ex==e&&s.st=='Approved').map(s=>s.amt));
const epend=e=>sum(S.s.filter(s=>s.ex==e&&s.st=='Pending').map(s=>s.amt));
const cbal=n=>sum(live().filter(o=>o.shop==n).map(tot))-sum(S.cp.filter(p=>p.cust==n).map(p=>p.amt));
const today=()=>new Date().toLocaleDateString('en-IN');
const pd=s=>{const[d,m,y]=String(s).split('/');return new Date(y,m-1,d).getTime()||0};
const dnum=s=>{const i=String(s||'').match(/^(\d{4})-(\d\d)-(\d\d)/),p=String(s||'').split('/');return i?Date.UTC(+i[1],+i[2]-1,+i[3])/864e5:p.length==3?Date.UTC(+p[2],+p[1]-1,+p[0])/864e5:0};
const inRange=(d,a,b)=>(!a||dnum(d)>=a)&&(!b||dnum(d)<=b);
const dm=s=>{const p=String(s||'').split('-');return p.length==3?p[2]+'/'+p[1]+'/'+p[0]:''};
const rng=(a,b)=>{const A=dnum(a),B=dnum(b);return d=>inRange(d,A,B)};
const rlab=(a,b)=>a||b?` between ${dm(a)||'the start'} and ${dm(b)||'today'}`:'';
const err=e=>e&&e.message?e.message:'unexpected error';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rO=r=>({id:r.id,no:r.no||'AY-'+String(r.id).padStart(4,'0'),date:r.date,by:r.agent,shop:r.shop,items:r.items||[],st:r.status,disc:+(r.disc||0),taxp:+(r.taxp||0),due:r.due||'',notes:r.notes||''});
const rC=r=>({id:r.id,name:r.name,phone:r.phone||'',addr:r.addr||''});
const rSt=r=>({id:r.id,name:r.name,phone:r.phone||'',area:r.area||''});
const rS=r=>({id:r.id,ex:r.ex,amt:+r.amount,mode:r.mode,date:r.date,st:r.status});
const rPay=r=>({id:r.id,cust:r.cust,amt:+r.amount,mode:r.mode,date:r.date});
const rPd=r=>({id:r.id,serial:+(r.serial||0),name:r.name,pcs:+(r.pcs||0),rate:+(r.rate||0)});
const ST=()=>S.st.map(x=>x.name);
const byName=a=>a.sort((x,y)=>x.name.localeCompare(y.name));

let S={o:[],s:[],cp:[],c:[],st:[],prod:[]},ME=null,LMODE='in';
let tab='orders',f='All',q='',qc='',qs='',qk='',lq='',lt='Customer',le='';
let odf='',odt='',cdf='',cdt='',ldf='',ldt='';
const T=[['orders','📦','Orders'],['collect','💰','Collection'],['cust','👥','Customers'],['staff','🧑‍💼','Staff'],['prod','🧴','Products'],['ledger','📒','Ledger']];
const H={orders:['Orders','Create and manage orders'],collect:['Collection','Approve payments and receive money'],cust:['Customers','Your shops and outstanding'],staff:['Staff','Executives and their dues'],prod:['Products','Catalogue used on invoices'],ledger:['Ledger','Statement with running balance']};
const ACT={orders:['+ New order','newOrder'],collect:['+ Add collection','newColl'],cust:['+ New customer','newCust'],staff:['+ Add staff','newStaff'],prod:['+ Add product','newProd']};

/* LOGIN */
function mode(m){
 LMODE=m;$('#lgb').classList.toggle('up',m=='up');
 $('#t1').className=m=='in'?'on':'';$('#t2').className=m=='up'?'on':'';
 $('#nmw').hidden=m!='up';$('#lgo').textContent=m=='up'?'Create account':'Login';
 $('#pw').autocomplete=m=='up'?'new-password':'current-password';
 $('#lgsub').textContent=m=='up'?'New here? Register your number to get started':'Office panel · sign in to continue';
 $('#lge').textContent='';
}
function peye(){const i=$('#pw');i.type=i.type=='password'?'text':'password';$('#eye').textContent=i.type=='password'?'👁':'🙈'}
function lerr(msg){
 $('#lge').innerHTML=`<span class="ei">⚠</span>${esc(msg)}`;
 const c=$('#lgb');c.classList.remove('shk');void c.offsetWidth;c.classList.add('shk');
}
function doSubmit(e){e.preventDefault();doAuth();return false}
async function doAuth(){
 const ph=$('#ph').value.replace(/\D/g,''),pw=$('#pw').value;
 if(ph.length!=10)return lerr('Enter the full 10-digit mobile number.');
 if(!pw)return lerr('Enter a password.');
 if(LMODE=='up'){
  if(pw.length<4)return lerr('Use at least 4 characters for the password.');
  if(pw!=$('#pw2').value)return lerr('The two passwords do not match.');
 }
 $('#lgo').disabled=true;$('#lge').innerHTML='<span class="wt">Please wait…</span>';
 try{LMODE=='up'?await signup(ph,pw):await signin(ph,pw)}
 catch(e){lerr(err(e));$('#lgo').disabled=false}
}
async function signup(ph,pw){
 const {data:du}=await db.from('accounts').select('id').eq('phone',ph).maybeSingle();
 if(du)throw new Error('This number is already registered. Switch to Login.');
 const name=$('#nm').value.trim();
 const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const {error}=await db.from('accounts').insert({phone:ph,name,salt,pw_hash:await sha(salt+':'+ph+':'+pw)});
 if(error)throw new Error('Could not create account: '+error.message);
 await enter({phone:ph,name});
}
async function signin(ph,pw){

 }
 c.name=n;c.phone=phone;c.addr=addr;byName(S.c);R();done('Customer updated')}

 if(!n)return alert('Enter name');

/* PRODUCTS */
function nextSerial(){return S.prod.reduce((m,p)=>Math.max(m,+p.serial||0),0)+1}
const newProd=()=>openM('Add product',()=>prodForm());
function prodForm(x){
 const p=x||{serial:nextSerial(),name:'',pcs:'',rate:''};
 return `<div class="fl"><div><div class="k">Serial No</div><input type="number" min="1" id="pser" value="${p.serial||''}" placeholder="Auto"></div><div><div class="k">Rate (₹)</div><input type="number" min="0" step="0.01" id="prate" value="${p.rate||''}" placeholder="0.00"></div></div>`
 +`<div class="k">Product name</div><input id="pname" value="${esc(p.name)}" placeholder="e.g. Neem & Tulsi Soap">`
 +`<div class="k">Pcs / box</div><input type="number" min="0" id="ppcs" value="${p.pcs||''}" placeholder="Pieces in one box">`
 +`<button class="btn" type="button" onclick="${x?`updP(${x.id})`:'addP()'}">Save product</button>${x?`<button class="btn d" type="button" onclick="delP(${x.id})">Delete</button>`:''}`}
function prodRead(){return {serial:Math.round(+$('#pser').value||0),name:$('#pname').value.trim(),pcs:Math.round(+$('#ppcs').value||0),rate:+$('#prate').value||0}}
function editP(id){const x=S.prod.find(p=>p.id==id);if(x)openM('Edit product',()=>prodForm(x))}
async function addP(){
 const v=prodRead();
 if(!v.name)return alert('Enter the product name');
 if(!(v.rate>0))return alert('Enter a rate above 0 — that is what invoices pick up');
 if(S.prod.some(p=>p.name.toLowerCase()==v.name.toLowerCase()))return alert('A product with that name already exists');
 const {data,error}=await db.from('products').insert(v).select().single();
 if(error)return fail(error);
 S.prod.push(rPd(data));R();done(v.name+' added to products')}
async function updP(id){
 const x=S.prod.find(p=>p.id==id);if(!x)return closeM();
 const v=prodRead();
 if(!v.name)return alert('Enter the product name');
 if(!(v.rate>0))return alert('Enter a rate above 0');
 if(S.prod.some(p=>p.id!=id&&p.name.toLowerCase()==v.name.toLowerCase()))return alert('Another product already uses that name');
 const {error}=await db.from('products').update(v).eq('id',id);
 if(error)return fail(error);
 Object.assign(x,v);R();done('Product updated')}
async function delP(id){
 const x=S.prod.find(p=>p.id==id);if(!x)return;
 const used=S.o.filter(o=>o.items.some(i=>i.p==x.name)).length;
 if(!confirm(`Delete ${x.name}?${used?`\nIt appears on ${used} existing invoice(s). Those invoices keep their own copy of the name and rate, so nothing on them changes.`:''}`))return;
 const {error}=await db.from('products').delete().eq('id',id);
 if(error)return fail(error);
 S.prod=S.prod.filter(p=>p.id!=id);R();done(x.name+' deleted')}
function Vp(){
 const rs=S.prod.map(p=>p.rate);
 return `<div class="kp">${kp('Products',S.prod.length)}${kp('With box size',S.prod.filter(p=>p.pcs>0).length)}${kp('Lowest rate',rs.length?fm(Math.min(...rs)):'—')}${kp('Highest rate',rs.length?fm(Math.max(...rs)):'—')}</div>`
 +`<div class="card"><div class="tw"><table><tr><th class="n">Serial No</th><th>Product Name</th><th class="n">Pcs/Box</th><th class="n">Rate</th><th>Actions</th></tr>${S.prod.map(p=>`<tr><td class="n">${p.serial||'—'}</td><td>${esc(p.name)}</td><td class="n">${p.pcs||'—'}</td><td class="n">${fm(p.rate)}</td><td><button class="btn o" onclick="editP(${p.id})">Edit</button><button class="btn d" onclick="delP(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products yet — add your first item</td></tr>'}</table></div><div class="m" style="margin-top:8px">Invoices already created keep the name and rate they were billed with, so editing here only changes future entries.</div></div>`}
/* LEDGER */
function rows(){
 let r=[];
 if(lt=='Customer'){live().filter(o=>o.shop==le).forEach(o=>r.push({d:o.date,t:'Invoice '+o.no,dr:tot(o),cr:0,k:0,id:o.id}));S.cp.filter(p=>p.cust==le).forEach(p=>r.push({d:p.date,t:'Payment ('+p.mode+')',dr:0,cr:p.amt,k:1,id:p.id}))}
 else{live().filter(o=>o.by==le).forEach(o=>r.push({d:o.date,t:'Invoice '+o.no+' · '+o.shop,dr:tot(o),cr:0,id:o.id,k:0}));S.s.filter(s=>s.ex==le&&s.st=='Approved').forEach(s=>r.push({d:s.date,t:'Settlement ('+s.mode+')',dr:0,cr:s.amt,k:1,id:s.id}))}
 r.sort((a,b)=>dnum(a.d)-dnum(b.d)||a.k-b.k||a.id-b.id);let b=0;r.forEach(x=>{b+=x.dr-x.cr;x.b=b});return r}
function ltable(r,open){
 open=open||0;
 const op=(ldf||ldt)&&open?`<tr><td>${ldf?dm(ldf):'—'}</td><td><b>Opening balance</b></td><td class="n"></td><td class="n"></td><td class="n"><b>${fm(open)}</b></td></tr>`:'';
 return `<div class="tw"><table><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>${op}${r.map(x=>`<tr><td>${x.d}</td><td>${esc(x.t)}</td><td class="n">${x.dr?fm(x.dr):''}</td><td class="n">${x.cr?fm(x.cr):''}</td><td class="n">${fm(x.b)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No entries'+(ldf||ldt?' in this date range':'')+'</td></tr>'}${(r.length||open)?`<tr><td colspan="2"><b>Closing balance${ldt?' as on '+dm(ldt):''}</b></td><td class="n"><b>${fm(sum(r.map(x=>x.dr)))}</b></td><td class="n"><b>${fm(sum(r.map(x=>x.cr)))}</b></td><td class="n"><b>${fm(r.length?r[r.length-1].b:open)}</b></td></tr>`:''}</table></div>`}
function lr(){
 const all=rows(),A=dnum(ldf),B=dnum(ldt);let open=0;
 all.forEach(x=>{if(dnum(x.d)<A)open=x.b});
 return {r:all.filter(x=>inRange(x.d,A,B)),open:open}}
function names(){return lt=='Customer'?S.c.map(c=>c.name):ST()}
function Vl(){
 const list=names();if(!list.includes(le))le=list[0]||'';
 return `<div class="chips">${['Customer','Executive'].map(s=>`<button class="${s==lt?'on':''}" onclick="lt='${s}';le='';lq='';R()">${s} ledger</button>`).join('')}</div>
 ${dr(ldf,ldt,'ldf','ldt',clr('ldf','ldt'))}
 <div class="card"><input placeholder="🔍 Search ${lt=='Customer'?'customer':'staff'} name" value="${esc(lq)}" oninput="lq=this.value;$('#lbox').innerHTML=lbox()"><div id="lbox">${lbox()}</div><div class="m" style="margin-top:8px">Debit = invoices (after returns). Credit = payments received${lt=='Executive'?' (approved settlements only)':''}.${ldf||ldt?' Balances stay absolute: the statement opens with what was outstanding'+(ldf?' before '+dm(ldf):'')+' and closes with the real balance.'+(ldt?' Entries after '+dm(ldt)+' are hidden.':''):''}</div></div>`}
function lbox(){
 const k=lq.toLowerCase().trim(),list=names().filter(n=>hit(k,n));
 if(list.length&&!list.includes(le))le=list[0];
 const w=list.includes(le)?lr():{r:[],open:0};
 return `<select onchange="le=this.value;lq='';R()">${list.map(n=>`<option value="${esc(n)}" ${n==le?'selected':''}>${esc(n)}</option>`).join('')||`<option value="">${k?'No '+(lt=='Customer'?'customer':'staff')+' matches “'+esc(lq)+'”':'No '+(lt=='Customer'?'customers':'staff')+' yet'}</option>`}</select>${ltable(w.r,w.open)}${w.r.length?`<button class="btn o" onclick="lp()">Print ledger</button>`:''}`}
function lp(){
 const w=lr();
 $('#inv').innerHTML=`<div class="sheet"><h2 style="margin:0">Ayurgra Herbal Soap</h2><div style="color:#555">${lt} ledger · ${esc(le)} · ${today()}${(ldf||ldt)?' · '+rlab(ldf,ldt):''}</div>${ltable(w.r,w.open)}<button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button></div>`;$('#inv').hidden=false}
/* INVOICE */
function inv(id){
 const o=S.o.find(x=>x.id==id),c=S.c.find(x=>x.name==o.shop),rt=sum(o.items.map(i=>i.r*i.pr));
 const g=gross(o),d=Math.min(+o.disc||0,g),t=tot(o)-(g-d);
 $('#inv').innerHTML=`<div class="sheet"><div class="ivtop"><div><h2>Ayurgra Herbal Soap</h2><div class="ivsub">Ayurvedic &amp; herbal products</div></div><div class="ivmeta"><b>TAX INVOICE</b><div>${o.no}</div><div>${o.date}</div>${o.due?`<div>Due: ${o.due}</div>`:''}</div></div>`
 +`<div class="ivgrid"><div><div class="k">Bill to</div><b>${esc(o.shop)}</b>${c&&c.phone?`<div>${esc(c.phone)}</div>`:''}${c&&c.addr?`<div>${esc(c.addr)}</div>`:''}</div><div><div class="k">Delivery through</div><b>${esc(o.by)}</b><div>Status: ${o.st}</div></div></div>`
 +`<table><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr>${o.items.map(i=>`<tr><td>${esc(i.p)}</td><td class="n">${i.q}</td><td class="n">${fm(i.pr)}</td><td class="n">${fm(i.q*i.pr)}</td></tr>`).join('')}`
 +(rt?`<tr class="ivl"><td colspan="3">Less: returns</td><td class="n">−${fm(rt)}</td></tr>`:'')
 +`<tr class="ivl"><td colspan="3">Subtotal</td><td class="n">${fm(g)}</td></tr>`
 +(d?`<tr class="ivl"><td colspan="3">Less: discount</td><td class="n">−${fm(d)}</td></tr>`:'')
 +(t?`<tr class="ivl"><td colspan="3">Add: GST / tax @ ${o.taxp}%</td><td class="n">${fm(t)}</td></tr>`:'')
 +`<tr class="ivgt"><td colspan="3">Total payable</td><td class="n">${fm(tot(o))}</td></tr></table>`
 +`<div class="ivw">Amount in words: ${words(tot(o))} rupees only</div>`
 +(o.notes?`<div class="ivn"><b>Notes &amp; terms</b><br>${esc(o.notes)}</div>`:'')
 +`<div class="ivfoot">Goods once sold are taken back only as per company policy · Thank you for your business</div><div class="ivsign"><div>Customer signature</div><div>For Ayurgra Herbal Soap</div></div>`
 +`<button class="btn np" onclick="print()">Print</button><button class="btn o np" onclick="$('#inv').hidden=true">Close</button></div>`;
 $('#inv').hidden=false}
function words(n){
 n=Math.round(+n||0);if(!n)return 'Zero';
 const ONE=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const TEN=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const t2=v=>v<20?ONE[v]:TEN[Math.floor(v/10)]+(v%10?' '+ONE[v%10]:'');
 const t3=v=>[(v>=100?ONE[Math.floor(v/100)]+' Hundred':''),(v%100?t2(v%100):'')].filter(s=>s).join(' ');
 let out=[],r=n;
 if(r>=10000000){out.push(t2(Math.floor(r/10000000))+' Crore');r%=10000000}
 if(r>=100000){out.push(t2(Math.floor(r/100000))+' Lakh');r%=100000}
 if(r>=1000){out.push(t2(Math.floor(r/1000))+' Thousand');r%=1000}
 if(r>0)out.push(t3(r));
 return out.join(' ')}

(async function boot(){
 if(!db){$('#lgo').disabled=true;$('#dot').className='dot no';return lerr('supabase-js did not load — this page needs an internet connection.')}
 if(!window.crypto||!crypto.subtle){$('#lgo').disabled=true;$('#dot').className='dot no';return lerr('This browser blocks secure hashing. Open the file locally (file://) or over https.')}
 mode('in');ping();
 const keep=sessionStorage.getItem('ay.me');
 if(keep){try{ME=JSON.parse(keep)}catch(e){ME=null}}
 if(ME)await enter(ME);else $('#ph').focus();
})();
